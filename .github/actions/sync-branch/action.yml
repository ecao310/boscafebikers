name: Sync one branch's ride data
description: >-
  Refresh the ride data of whatever branch the caller has checked out into the
  workspace — events, past archive, café points, route maps, rides.ics — and
  commit + push it only if something actually changed.

# Deliberately branch-agnostic: it runs against the checkout in the workspace
# and pushes with a plain `git push`, so `sync.yml` can call it once for master
# (the live site) and once for dev (the /preview/ subtree) without the pipeline
# existing in two places. Because the caller checks the branch out, each branch
# runs *its own* copy of scripts/ — which is the point: dev may carry newer
# pipeline code than master.

inputs:
  ics-url:
    description: >-
      The private Partiful ICS feed URL (secrets.PARTIFUL_ICS_URL). Reaches the
      sync step as an env var only — never as a CLI argument, since arguments
      show up in workflow logs.
    required: true

outputs:
  changed:
    description: "'true' when this run committed and pushed ride data."
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    # Thirty seconds of insurance before anything touches ride data: the
    # pipeline below runs *this branch's* scripts/, and dev in particular can
    # be carrying half-finished code. The suite is offline (it parses
    # tests/fixtures/sample.ics with a pinned clock), so it needs no secret
    # and cannot be flaky on the network. ci.yml runs the same command on
    # every push; this is the gate for the cron, which pushes without one.
    - name: Check the branch's scripts before touching ride data
      shell: bash
      run: python -m pytest tests/ -q

    # The whole pipeline, in one process: fetch, archive, backfill, geocode,
    # draw the missing maps, publish, re-export the calendar. The order used to
    # be eight `run:` steps in this file, where nothing could test it; it lives
    # in scripts/sync.py's STEPS now and tests/test_sync.py reorders that tuple
    # to prove each rule still bites. The script writes a file only when its
    # content changed, so a quiet sync leaves zero bytes for the commit step
    # below to find. The secret reaches this step and no other.
    - name: Sync the ride data
      shell: bash
      env:
        PARTIFUL_ICS_URL: ${{ inputs.ics-url }}
      run: python scripts/sync.py --data-dir site

    - name: Commit the ride data if changed
      id: commit
      shell: bash
      run: |
        # Stage first, then diff the index: the route maps are *new* files,
        # and a plain `git diff` doesn't see untracked ones.
        git add -A site/events.json site/events-past.json site/maps site/rides.ics \
          site/cafe-points.json
        if git diff --cached --quiet; then
          echo "No ride changes; nothing to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Sync rides from Partiful feed"
        # Plain `git push`: actions/checkout leaves the checked-out branch
        # tracking its remote, so this pushes master from the master job and
        # dev from the dev job with nothing branch-specific in here.
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
