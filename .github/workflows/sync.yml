name: Sync rides

on:
  schedule:
    # Every 6 hours, on the hour (UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Serializes whole *runs* — the two sync jobs below are free to run in
# parallel inside one run, because they push to different branches.
concurrency:
  group: sync-rides
  cancel-in-progress: false

jobs:
  # Both trees Pages publishes get their data synced: master (the live site)
  # here, dev (the /preview/ subtree) below. Same pipeline both times — it
  # lives once, in .github/actions/sync-branch, so the two can't drift.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      # By *name*, like pages.yml: a dispatch on some other ref must still
      # sync the branch it says it syncs.
      - name: Check out master (the live site)
        uses: actions/checkout@v4
        with:
          ref: master

      # Order matters: this one is second because a checkout into the
      # workspace root wipes anything already sitting there.
      #
      # `uses: ./…` resolves against the workspace, so the composite has to be
      # checked out. It comes from *this workflow's own ref* (no `ref:` here),
      # not from the branch being synced — the branch supplies scripts/, the
      # workflow supplies its own pipeline, and a two-branch sync added on dev
      # works before it has been merged into master.
      - name: Check out this workflow's copy of the sync action
        uses: actions/checkout@v4
        with:
          path: .sync-action

      - name: Refresh master's ride data
        id: sync
        uses: ./.sync-action/.github/actions/sync-branch
        with:
          ics-url: ${{ secrets.PARTIFUL_ICS_URL }}

  # Same again for dev. Without this the preview keeps being *redeployed* on
  # every sync (pages.yml rebuilds both trees) while its events.json, archive,
  # maps and rides.ics sit at whatever dev last committed — i.e. stale rides on
  # /preview/ between human pushes. A checkout of dev also runs dev's own
  # scripts/, so a pipeline change can be tried on the preview before it ships.
  sync-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      # dev is optional (pages.yml makes the same check before publishing a
      # preview); no dev branch must not mean a red sync every 6 hours.
      - name: Check whether a dev branch exists
        id: devcheck
        run: |
          if git ls-remote --exit-code --heads \
              "https://github.com/${{ github.repository }}.git" dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dev branch; nothing to sync for the preview."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out dev (the /preview/ subtree)
        if: steps.devcheck.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Check out this workflow's copy of the sync action
        if: steps.devcheck.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          path: .sync-action

      - name: Refresh dev's ride data
        id: sync
        if: steps.devcheck.outputs.exists == 'true'
        uses: ./.sync-action/.github/actions/sync-branch
        with:
          ics-url: ${{ secrets.PARTIFUL_ICS_URL }}

  # The pushes above use GITHUB_TOKEN, which deliberately does not fire `push`
  # workflow triggers — so Pages would never redeploy. Call the deploy workflow
  # ourselves instead, and only when the rides actually changed. One call
  # republishes *both* trees (pages.yml checks master and dev out by name), so
  # either branch committing is reason enough to run it.
  #
  # `!cancelled()` instead of the default success() gate: dev is where
  # half-finished code lives, and a broken preview sync must never hold back a
  # deploy of the live site. Neither branch committing → no deploy, as before.
  deploy:
    needs: [sync, sync-dev]
    if: ${{ !cancelled() && (needs.sync.outputs.changed == 'true' || needs.sync-dev.outputs.changed == 'true') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
