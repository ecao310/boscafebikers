name: Sync rides

on:
  schedule:
    # Every 6 hours, on the hour (UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-rides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rides
        env:
          PARTIFUL_ICS_URL: ${{ secrets.PARTIFUL_ICS_URL }}
        # Write to a scratch file first: build_payload() stamps a fresh
        # updated_at every run, so site/events.json would always look changed.
        run: |
          python scripts/fetch_rides.py \
            --out "$RUNNER_TEMP/events.json" \
            --past-out "$RUNNER_TEMP/events-past.json"

      # Runs BEFORE the promote: site/events.json still holds the previous
      # upcoming list, so any ride that has since started gets archived even if
      # Partiful has already dropped it from the feed.
      - name: Archive rides that have already happened
        run: |
          python scripts/archive_events.py --archive site/events-past.json \
            site/events.json "$RUNNER_TEMP/events-past.json"

      # Rides that land in the archive straight from the feed's past export were
      # never enriched (only the upcoming list is). The feed carries years of
      # them, so fill in a few per run rather than re-fetching all of them every
      # 6 hours; once the archive is checked this step is a no-op.
      # No secret here: enrichment only ever touches public event pages.
      - name: Backfill images and routes on a few archived rides
        run: python scripts/enrich_archive.py --limit 8 site/events-past.json

      # Runs on the *scratch* copy, BEFORE the promote below. render_route_maps
      # adds `map_image`, which a fresh fetch never has — patch it in here and
      # promote is comparing like with like. Do it after the promote instead and
      # the committed file can never match the fetch, so every single run
      # commits a new updated_at forever. (Found by running the sync twice.)
      # Idempotent: a ride whose finished SVG is already committed is skipped,
      # so this only draws maps for rides that turned up since the last sync
      # (plus any map drawn while the tile server was down — those are left
      # unmarked and get their basemap on a later run).
      - name: Draw a route map for any ride that doesn't have one
        run: |
          python scripts/render_route_maps.py \
            --out-dir site/maps --url-prefix maps \
            "$RUNNER_TEMP/events.json" site/events-past.json

      - name: Update site/events.json only if the rides changed
        run: python scripts/promote_events.py "$RUNNER_TEMP/events.json" site/events.json

      # The one step that runs AFTER the promote, and it has to. The public
      # calendar's DTSTAMP is derived from the payload's `updated_at`, which is
      # stamped fresh on every fetch — build rides.ics from the scratch file and
      # it would carry a new timestamp every 6 hours, so the commit guard would
      # fire forever (exactly the churn promote_events.py exists to stop, and
      # the mirror image of why the maps step must run *before* the promote).
      # site/events.json only changes when the rides do, so exporting from it
      # makes the .ics byte-stable across no-op syncs. export_ics.py rewrites
      # the file only when its bytes changed, as a second guard.
      - name: Re-export the public subscribable calendar
        run: python scripts/export_ics.py site/events.json --out site/rides.ics

      - name: Commit the ride data if changed
        id: commit
        run: |
          # Stage first, then diff the index: the route maps are *new* files,
          # and a plain `git diff` doesn't see untracked ones.
          git add -A site/events.json site/events-past.json site/maps site/rides.ics
          if git diff --cached --quiet; then
            echo "No ride changes; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync rides from Partiful feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The push above uses GITHUB_TOKEN, which deliberately does not fire `push`
  # workflow triggers — so Pages would never redeploy. Call the deploy workflow
  # ourselves instead, and only when the rides actually changed.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
